name: Release

# Pushing a tag v<version> releases both packages: full CI, build and license
# checks, PyPI upload (plugin first) through Trusted Publishing, then a GitHub
# Release with the CHANGELOG section as notes and the artifacts attached.
# See docs/maintainers/releasing.md.
#
# Running it by hand (Actions -> Release -> Run workflow) is a dry run: CI,
# build, and the artifact upload/download the publish jobs rely on, but nothing
# is published. Use it after changing this file or the actions it uses.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and check
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python scripts/release_check.py --tag "$GITHUB_REF_NAME" --notes-out release-notes.md
          else
            python scripts/release_check.py --draft --notes-out release-notes.md
          fi
      - run: pip install build twine
      # Version sync, twine check --strict and the license check on every
      # wheel and sdist; artifacts land in dist/<distribution name>/.
      - run: scripts/publish_pypi.sh --outdir dist
        env:
          PYTHON_BIN: python
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  # Only for a manual run: checks that the downloaded artifact has exactly the
  # layout the publish and release jobs below expect.
  dry-run:
    name: Dry run (nothing published)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: |
          set -eu
          for dir in dist/chessnets-lc0-protobuf dist/chessnets; do
            ls "$dir"/*.whl "$dir"/*.tar.gz
            [ "$(ls "$dir" | wc -l)" -eq 2 ] || { echo "expected one wheel and one sdist in $dir"; exit 1; }
          done
          test -s release-notes.md
          echo "Release notes:"; cat release-notes.md
          echo "A tag push would publish v$VERSION (prerelease: $PRERELEASE)."
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}

  publish-plugin:
    name: Publish chessnets-lc0-protobuf to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Each PyPI project has its own environment: PyPI rejects two trusted
    # publishers with identical repository, workflow and environment.
    environment:
      name: pypi-lc0-protobuf
      url: https://pypi.org/project/chessnets-lc0-protobuf/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/chessnets-lc0-protobuf/

  # The core goes second so its lc0-protobuf extra never points at a missing
  # plugin release.
  publish-core:
    name: Publish chessnets to PyPI
    if: github.event_name == 'push'
    needs: publish-plugin
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chessnets/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/chessnets/

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "ChessNets $VERSION"
          --notes-file release-notes.md
          --verify-tag
          $([ "$PRERELEASE" = true ] && echo --prerelease)
          dist/chessnets-lc0-protobuf/* dist/chessnets/*
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
